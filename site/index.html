<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tareas</title>
  <meta name="description" content="Organizador de tareas sobre Google Tasks">
  <meta name="theme-color" content="#181825">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="login" class="screen" hidden>
    <div class="card">
      <img src="icons/icon.svg" alt="" width="72" height="72">
      <h1>Tareas</h1>
      <p id="loginMsg">Conecta tu cuenta para ver tus listas de Google Tasks.</p>
      <button id="loginBtn" class="primary">Entrar con Google</button>
      <p id="loginErr" class="err" role="alert"></p>
      <a href="?demo">Ver demo con datos de ejemplo</a>
    </div>
  </div>

  <div id="app" hidden>
    <nav id="nav" aria-label="Vistas">
      <div class="brand"><img src="icons/icon.svg" alt="" width="26" height="26">Tareas</div>
      <button data-view="today"><span class="lbl">Hoy<span class="wide"> y atrasadas</span></span><span class="count"></span></button>
      <button data-view="week"><span class="lbl"><span class="wide">Próximos </span>7 días</span><span class="count"></span></button>
      <button data-view="subjects"><span class="lbl"><span class="wide">Por </span>asignatura</span><span class="count"></span></button>
      <button data-view="nodate"><span class="lbl">Sin fecha</span><span class="count"></span></button>
      <div class="foot">
        <div class="keys">
          <span><kbd>n</kbd> nueva</span><span><kbd>j</kbd><kbd>k</kbd> moverse</span>
          <span><kbd>x</kbd> completar</span><span><kbd>d</kbd> fecha</span>
          <span><kbd>r</kbd> refrescar</span><span><kbd>f</kbd> filtro ⚡</span>
          <span><kbd>↵</kbd> plegar</span><span><kbd>1</kbd>–<kbd>4</kbd> vistas</span>
        </div>
      </div>
    </nav>

    <main>
      <header id="top">
        <div class="heading">
          <h1 id="viewTitle"></h1>
          <span id="summary"></span>
        </div>
        <div class="actions">
          <button id="moveOverdue" hidden title="Pasar todas las atrasadas a hoy">Atrasadas → hoy</button>
          <button id="filterBtn" aria-pressed="false" title="Mostrar solo ⚡ (f)">⚡</button>
          <button id="refreshBtn" title="Refrescar (r)" aria-label="Refrescar"><span>↻</span></button>
          <button id="logoutBtn" title="Cerrar sesión" aria-label="Cerrar sesión">⏻</button>
        </div>
      </header>

      <div id="banner" hidden></div>

      <form id="add" autocomplete="off">
        <input id="addTitle" type="text" placeholder="Nueva tarea…  (n)" aria-label="Título de la nueva tarea" enterkeyhint="done">
        <div class="extra">
          <select id="addList" aria-label="Lista"></select>
          <input id="addDate" type="date" aria-label="Fecha">
          <button class="primary" type="submit">Añadir</button>
        </div>
      </form>

      <div id="list"></div>
      <div id="status"></div>
    </main>
  </div>

  <dialog id="dateDlg">
    <h3>Cambiar fecha</h3>
    <p id="dateTask"></p>
    <div class="quick" id="dateQuick"></div>
    <label>Otra fecha <input id="dateInput" type="date"></label>
    <div class="row">
      <button id="dateCancel" type="button">Cancelar</button>
      <button id="dateSave" type="button" class="primary">Guardar</button>
    </div>
  </dialog>

  <div id="toast" role="status" hidden></div>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
